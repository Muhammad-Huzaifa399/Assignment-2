<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

    <header>
        <div class="head">

            <div class="logo">

            <div class="navbar">

                    <li>Home</li>

    <section>

                <p>LUOX Gaming is free Bootstrap 5 HTML CSS website template for your gaming websites. You can download and use this layout for commercial purposes. Please tell your friends about TemplateMo</p>
                <input class="serach" type="text" placeholder="Type Something">
                <button class="bar">SEARCH NOW</button>
            </div>
            <div>
                <div>
                    <img class="main-image" src="./Images/main-images.jpg" alt="main">
                </div>
